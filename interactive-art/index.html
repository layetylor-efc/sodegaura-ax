<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b19">
<meta name="description" content="タップした場所から六角形が呼吸するインタラクティブ幾何学模様 HEX BREATH">
<title>HEX BREATH — Touch Reactive</title>
<style>
:root {color-scheme:dark;--ink:#ecf5ff;--dim:#a6b3d2;--glass:rgba(12,17,37,.66);--edge:rgba(173,203,255,.16);--accent:#73e4ff;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b19;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{overscroll-behavior:none}canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;outline:none}
.top{position:fixed;z-index:2;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:clamp(14px,3vw,32px);pointer-events:none}
.brand{max-width:450px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.28em;color:#8aa4cc;text-transform:uppercase;margin-bottom:8px}
h1{font-size:clamp(26px,5vw,49px);line-height:1;letter-spacing:.13em;margin:0 0 12px;font-weight:850;text-shadow:0 2px 30px rgba(54,147,255,.22)}
.brand p{font-size:clamp(12px,1.3vw,14px);color:var(--dim);line-height:1.7;margin:0;text-shadow:0 2px 9px #080b19}
.stamp{text-align:right;font-size:10px;line-height:1.7;letter-spacing:.06em;color:#8093bd;white-space:nowrap}
.bottombar{position:fixed;z-index:4;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;width:max-content;max-width:calc(100vw - 22px);border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 12px;border-radius:21px;box-shadow:0 20px 60px #0007}
button,select,input{font:inherit}button,select{border:1px solid rgba(155,185,230,.2);color:var(--ink);background:rgba(34,46,81,.66);border-radius:11px;min-height:39px;padding:8px 12px;font-size:12px;font-weight:700;transition:background .2s,border-color .2s;cursor:pointer}
button:hover,select:hover{background:rgba(52,76,125,.82);border-color:rgba(144,231,255,.44)}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #81e5ff;outline-offset:2px}
button.primary{border-color:rgba(93,218,255,.38);color:#baf5ff;background:rgba(29,104,140,.30)}button[aria-pressed=true]{background:rgba(40,135,157,.45);border-color:#7ae9ff}
body.lite-mode .bottombar{backdrop-filter:none;-webkit-backdrop-filter:none}
#lightMode[aria-pressed=true]{background:rgba(65,115,76,.72);border-color:#91efa6;color:#e1ffe5}
.controls{display:flex;align-items:center;gap:8px}.sliderwrap{display:flex;align-items:center;gap:8px;border-left:1px solid var(--edge);padding-left:12px;font-size:11px;color:#b8c9e8;white-space:nowrap}
input[type=range]{width:85px;accent-color:#75e6f7;cursor:pointer}.counter{font-variant-numeric:tabular-nums;min-width:48px;font-size:11px;color:#8fadd0}
.footnote{position:fixed;z-index:2;left:24px;bottom:110px;pointer-events:none;font-size:10px;letter-spacing:.1em;color:#58719e}
@media(max-width:600px){.top{padding:22px 18px}.stamp{font-size:9px}.brand p{max-width:270px}.bottombar{border-radius:17px;width:calc(100vw - 24px);gap:8px;padding:10px}.controls{justify-content:center;flex-wrap:wrap}button,select{min-height:38px;padding:8px 11px}.sliderwrap{border-left:0;padding-left:1px}.footnote{left:18px;bottom:137px;font-size:9px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}


/* The Japanese sunset mode is rendered with self-contained Canvas art (no external image). */
#sceneCaption{color:#ffd2aa;text-shadow:0 2px 14px #100916}
#theme{max-width:min(290px,75vw)}
@media(max-width:600px){#theme{max-width:min(230px,68vw)}}
</style>
<style id="civic-notice-style">:root{--civic-notice-space:68px}body{padding-top:var(--civic-notice-space)!important}#civic-notice{position:fixed!important;inset:0 0 auto 0!important;z-index:2147483647!important;display:flex!important;align-items:center;justify-content:center;box-sizing:border-box;min-height:58px;margin:0!important;padding:9px 16px calc(9px + env(safe-area-inset-top,0px))!important;background:#102b47!important;color:#fff!important;border-bottom:4px solid #ffcd38!important;box-shadow:0 4px 16px #0006!important;font:700 14px/1.45 system-ui,"Noto Sans JP",sans-serif!important;text-align:center;overflow-wrap:anywhere}#civic-notice strong{color:#ffde63!important}body .modebar,body .toolbar{top:var(--civic-notice-space)!important}body .top{top:calc(var(--mode,0px) + var(--civic-notice-space))!important}@media(max-width:600px){:root{--civic-notice-space:96px}#civic-notice{font-size:12px!important;padding:9px 10px!important}}@media(max-width:360px){:root{--civic-notice-space:112px}}</style></head>
<body><aside id="civic-notice" role="note" aria-label="非公式サイトの告知"><span><strong>⚠ 非公式・個人制作</strong> ｜ 本サイトは個人の実験的・非公式プロトタイプであり、袖ケ浦市および各官公庁とは一切関係ありません</span></aside>
<canvas id="scene" tabindex="0" aria-label="六角形のアニメーション。画面をタップまたはクリックするとその位置から波紋が広がります。Enterキーでも中央から広がります。"></canvas>
<header class="top"><div class="brand"><div class="eyebrow">Interactive geometry / tap to awaken</div><h1>HEX BREATH</h1><p>タップで六角形がひと波だけ広がる。<br>波の重ね掛けなし・軽量描画。</p></div><div class="stamp">AI曲芸師<br>2026.10.19<br></div></header>
<div class="footnote" id="sceneCaption">和の夕映え｜橙 → 朱赤 → 深紫 · 青海波・麻の葉・富士のシルエット</div>
<div class="bottombar" role="group" aria-label="アニメーションの設定">
 <div class="controls"><button id="center" class="primary" type="button">✦ 中央から波動</button><button id="pause" type="button" aria-pressed="false">Ⅱ 一時停止</button><button id="lightMode" type="button" aria-pressed="false" title="待機中の背景アニメーションを停止し、操作時だけ描画します">⚡ 軽量版 OFF</button><button id="circleEffects" type="button" aria-pressed="false" title="六角形は残して円形の波紋・光点・円形装飾だけ切り替えます">◯ 円エフェクト OFF</button><button id="clear" type="button">↺ リセット</button></div>
 <div class="controls"><label class="sliderwrap" for="speed">波の速さ <input id="speed" type="range" min="1" max="5" step="1" value="3"><output id="speedValue" for="speed">3</output></label><label class="sliderwrap" for="theme">色 <select id="theme"><option value="wa" selected>和の夕映え｜橙→朱赤→深紫</option><option value="aurora">オーロラ</option><option value="ice">アイス</option><option value="sunset">サンセット</option></select></label><span class="counter" id="count" aria-live="polite">WAVE 0</span></div>
</div>
<script>
(()=>{'use strict';
  const canvas=document.getElementById('scene');
  const ctx=canvas.getContext('2d',{alpha:false,desynchronized:false});
  if(!ctx){document.querySelector('.brand p').textContent='このブラウザーはCanvasに対応していません。';return;}
  const speedInput=document.getElementById('speed');
  const themeInput=document.getElementById('theme');
  const pauseButton=document.getElementById('pause');
  const lightButton=document.getElementById('lightMode');
  const circlesButton=document.getElementById('circleEffects');
  const countElement=document.getElementById('count');
  const colorSets={
    aurora:{base:210,a:184,b:271,c:316,bgTop:'#070b1a',bgBottom:'#11122a'},
    ice:{base:211,a:186,b:212,c:242,bgTop:'#041220',bgBottom:'#102035'},
    sunset:{base:270,a:307,b:18,c:44,bgTop:'#180b20',bgBottom:'#271127'},
    wa:{base:25,a:7,b:282,c:42,bgTop:'#823419',bgMid:'#992738',bgBottom:'#1a1033',japan:true}
  };
  let W=1,H=1,dpr=1,hexR=24,cells=[],bg=null,style=colorSets.wa,japanOverlay=null;
  let paused=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lightMode=false;
  let circleEffects=false; // Default: show all animated hexagons, hide only circular effects.
  try{
    lightMode=localStorage.getItem('hex-breath-lite')==='1';
    circleEffects=localStorage.getItem('hex-breath-circles')==='1';
  }catch(_){}
  let elapsed=0,last=0,lastPaint=0,raf=0,total=0;
  // The ambient clock pauses during touch effects and resumes immediately after the last wave ends.
  let ambientElapsed=0,backgroundResumeAt=0;
  let waves=[];let pointerLast=new Map();
  const TAU=Math.PI*2;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const smooth=(x)=>x*x*(3-2*x);
  // Keep at most one wave, and stop as soon as it has travelled beyond the viewport.
  function hasActiveWaves(){return waves.some(w=>(elapsed-w.born)<w.life);}
  function waveLifetime(x,y){
    const speed=220+Number(speedInput.value)*100;
    const furthest=Math.max(
      Math.hypot(x,y),Math.hypot(W-x,y),Math.hypot(x,H-y),Math.hypot(W-x,H-y)
    );
    return clamp((furthest+hexR*4)/speed*1000,450,3000);
  }
  function scheduleAnimation(){
    if(paused||document.hidden||raf||(lightMode&&!hasActiveWaves()))return;
    raf=requestAnimationFrame(frame);
  }
  function setPause(isPaused){
    paused=isPaused;pauseButton.setAttribute('aria-pressed',String(paused));
    pauseButton.textContent=paused?'▶ 再生':'Ⅱ 一時停止';
    if(paused){cancelAnimationFrame(raf);raf=0;last=0;lastPaint=0;}
    else{last=0;lastPaint=0;scheduleAnimation();}
  }
  function circlesVisible(){return !lightMode && circleEffects;}
  function syncCircleButton(){
    const visible=circlesVisible();
    circlesButton.setAttribute('aria-pressed',String(visible));
    circlesButton.textContent=visible?'◯ 円エフェクト ON':'◯ 円エフェクト OFF';
    circlesButton.disabled=lightMode;
    circlesButton.title=lightMode?'軽量版では円形演出は常時OFFです':'六角形の動きは残し、円形波紋・光点・装飾だけを切り替えます';
  }
  function setCircleEffects(enabled){
    circleEffects=enabled;
    try{localStorage.setItem('hex-breath-circles',circleEffects?'1':'0')}catch(_){}
    syncCircleButton();
    updateCaption();
    prepareJapaneseArt();
    draw();
  }
  function setLightMode(enabled){
    lightMode=enabled;document.body.classList.toggle('lite-mode',lightMode);
    lightButton.setAttribute('aria-pressed',String(lightMode));
    lightButton.textContent=lightMode?'⚡ 軽量版 ON':'⚡ 軽量版 OFF';
    lightButton.title=lightMode?'背景は静止・円形の波紋と光点は非表示。六角形の波動は再生します':'背景の呼吸アニメーションを再生します';
    canvas.setAttribute('aria-label',lightMode?'六角形の波動。画面のタップやEnterキーで六角形が光ります。円形の演出は非表示です。':'六角形のアニメーション。タップで六角形の波動が広がります。円形演出は別ボタンで切り替えられます。');
    syncCircleButton();
    updateCaption();
    try{localStorage.setItem('hex-breath-lite',lightMode?'1':'0');}catch(_){}
    cancelAnimationFrame(raf);raf=0;last=0;lastPaint=0;
    resize();scheduleAnimation();
  }
  function updateCaption(){
    document.getElementById('sceneCaption').textContent=style.japan
      ?(!circlesVisible()?'和の夕映え｜橙 → 朱赤 → 深紫 · 麻の葉・富士（円形装飾なし）':'和の夕映え｜橙 → 朱赤 → 深紫 · 青海波・麻の葉・富士のシルエット')
      :'TOUCH • HEX WAVE • BREATHE';
  }
  function resize(){
    W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);dpr=Math.min(window.devicePixelRatio||1,lightMode?1:2);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    hexR=clamp(Math.min(W/15,H/19),16,34);
    const dx=Math.sqrt(3)*hexR,dy=1.5*hexR;
    cells=[];
    const rowCount=Math.ceil(H/dy)+3,colCount=Math.ceil(W/dx)+3,screenMin=Math.max(1,Math.min(W,H));
    for(let row=-1;row<rowCount;row++){
      for(let col=-1;col<colCount;col++){
        const x=(col+(row&1)*.5)*dx+dx*.12,y=row*dy+dy*.10;
        if(x < -dx || x> W+dx || y < -dy || y > H+dy)continue;
        const hueOffset=((row*7+col*11)%19)/19;
        cells.push({x,y,hueOffset,ambientShift:(row*.31+col*.25)*.36+Math.hypot(x-W*.5,y-H*.48)/screenMin*2.3});
      }
    }
    bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,style.bgTop);if(style.bgMid)bg.addColorStop(.50,style.bgMid);bg.addColorStop(1,style.bgBottom);
    prepareJapaneseArt();
    draw();
  }

  // Original procedural Japanese imagery: sun, Fuji silhouette, asanoha and seigaiha.
  // It is cached on a separate canvas at resize / theme change, not redrawn per frame.
  function prepareJapaneseArt(){
    japanOverlay=null;
    if(!style.japan)return;
    const art=document.createElement('canvas');art.width=Math.ceil(W);art.height=Math.ceil(H);
    const pen=art.getContext('2d');if(!pen)return;
    const size=Math.min(W,H);
    // Decorative circle art is optional and independent of the hexagonal motion.
    if(circlesVisible()){
      const sx=W*.77,sy=H*.30,sunR=clamp(size*.13,42,120);
      const glow=pen.createRadialGradient(sx,sy,sunR*.3,sx,sy,sunR*1.8);
      glow.addColorStop(0,'rgba(255,186,83,.22)');
      glow.addColorStop(.68,'rgba(255,119,69,.10)');
      glow.addColorStop(1,'rgba(255,118,70,0)');
      pen.fillStyle=glow;pen.fillRect(Math.max(0,sx-sunR*1.8),Math.max(0,sy-sunR*1.8),sunR*3.6,sunR*3.6);
      pen.beginPath();pen.arc(sx,sy,sunR,0,TAU);
      pen.fillStyle='rgba(255,193,109,.18)';pen.fill();
      pen.lineWidth=2;pen.strokeStyle='rgba(250,199,117,.50)';pen.stroke();
    }
    // Sixfold asa-no-ha (hemp leaf) lattice is kept sparse and translucent.
    const aR=clamp(size*.055,20,45);
    pen.strokeStyle='rgba(255,210,146,.14)';pen.lineWidth=1;
    const cols=Math.min(6,Math.ceil(W/(aR*1.9)));
    for(let col=0;col<cols;col++){
      for(let row=0;row<3;row++){
        const cx=W*.07+col*aR*1.55+(row%2)*aR*.7,cy=H*.20+row*aR*1.7;
        if(cx>W*.61)continue;
        pen.beginPath();
        for(let i=0;i<6;i++){
          const t=(i*60-90)*Math.PI/180;
          const x=cx+Math.cos(t)*aR,y=cy+Math.sin(t)*aR;
          const n=(i+1)*60-90,nt=n*Math.PI/180;
          if(i===0)pen.moveTo(x,y);else pen.lineTo(x,y);
          pen.moveTo(cx,cy);pen.lineTo(x,y);
          const ix=cx+Math.cos(nt)*aR*.46,iy=cy+Math.sin(nt)*aR*.46;
          pen.moveTo(ix,iy);pen.lineTo(cx+Math.cos((nt+Math.PI/3))*aR*.46,cy+Math.sin((nt+Math.PI/3))*aR*.46);
        }
        pen.closePath();pen.stroke();
      }
    }
    // Fuji-inspired silhouette; low opacity keeps the reactive hexagons prominent.
    const peakX=W*.62,peakY=H*.51,baseY=H*.83,wide=Math.min(W*.4,280);
    pen.beginPath();pen.moveTo(peakX-wide,baseY);pen.lineTo(peakX,peakY);pen.lineTo(peakX+wide,baseY);pen.closePath();
    pen.fillStyle='rgba(21,12,39,.38)';pen.fill();
    pen.beginPath();pen.moveTo(peakX-wide*.21,peakY+(baseY-peakY)*.20);
    pen.lineTo(peakX,peakY);pen.lineTo(peakX+wide*.21,peakY+(baseY-peakY)*.20);
    pen.lineTo(peakX+wide*.10,peakY+(baseY-peakY)*.19);
    pen.lineTo(peakX,peakY+(baseY-peakY)*.23);
    pen.lineTo(peakX-wide*.10,peakY+(baseY-peakY)*.19);pen.closePath();
    pen.fillStyle='rgba(255,223,188,.25)';pen.fill();
    // Skip even cached static circular ornaments if circles are disabled.
    if(circlesVisible()){
      const radius=clamp(size*.073,24,54);
      pen.lineWidth=1.35;pen.strokeStyle='rgba(253,193,136,.23)';
      for(let row=0;row<5;row++){
        const y=H*.74+row*radius*.51;
        for(let x=-radius*2+(row%2)*radius;x<W+radius*2;x+=radius*2){
          for(let ring=1;ring<=3;ring++){
            pen.beginPath();pen.arc(x,y,radius*ring/3,Math.PI,TAU);pen.stroke();
          }
        }
      }
    }
    japanOverlay=art;
  }
  function addWave(x,y,power=1){
    // Replace the previous ripple: one tap produces one wave, never a stack.
    const px=clamp(x,0,W),py=clamp(y,0,H),life=waveLifetime(px,py);
    waves=[{x:px,y:py,born:elapsed,power,life}];
    backgroundResumeAt=elapsed+life;
    total++;countElement.textContent='WAVE '+total;
    if(paused)setPause(false);else scheduleAnimation();
  }
  function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0&&e.pointerType==='mouse')return;
    if(pointerLast.has(e.pointerId))return;
    const p=point(e);pointerLast.set(e.pointerId,true);
    addWave(p.x,p.y,1.25);
    try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  });
  // Dragging/holding the finger creates no additional waves.
  for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{
    pointerLast.delete(e.pointerId);
  });
  canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();addWave(W/2,H/2,1.35);}});
  document.getElementById('center').addEventListener('click',()=>addWave(W/2,H/2,1.45));
  document.getElementById('clear').addEventListener('click',()=>{waves=[];total=0;countElement.textContent='WAVE 0';backgroundResumeAt=elapsed;if(lightMode){cancelAnimationFrame(raf);raf=0;last=0;}draw();});
  pauseButton.addEventListener('click',()=>setPause(!paused));
  lightButton.addEventListener('click',()=>setLightMode(!lightMode));
  circlesButton.addEventListener('click',()=>setCircleEffects(!circleEffects));
  themeInput.addEventListener('change',()=>{style=colorSets[themeInput.value]||colorSets.wa;updateCaption();resize();});
  const speedValue=document.getElementById('speedValue');speedInput.addEventListener('input',()=>{speedValue.textContent=speedInput.value;});
  function hex(x,y,r){
    ctx.beginPath();
    for(let k=0;k<6;k++){const a=(k*60-30)*Math.PI/180;const X=x+Math.cos(a)*r,Y=y+Math.sin(a)*r;if(k===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}ctx.closePath();
  }
  function draw(){
    ctx.fillStyle=bg||'#080b19';ctx.fillRect(0,0,W,H);
    if(japanOverlay)ctx.drawImage(japanOverlay,0,0,W,H);
    const speed=220+Number(speedInput.value)*100;
    const alive=waves.filter(w=>(elapsed-w.born)<w.life);
    waves=alive;
    for(let i=0;i<cells.length;i++){
      const c=cells[i];
      const ambient=lightMode?.5:(.5+.5*Math.sin(ambientElapsed*.00165+c.ambientShift));
      let energy=0,field=0;
      for(let j=0;j<alive.length;j++){
        const w=alive[j],age=(elapsed-w.born)/1000;
        const dist=Math.hypot(c.x-w.x,c.y-w.y);
        const front=age*speed;
        const band=hexR*(1.6+age*.32);
        const ridge=Math.exp(-.5*((dist-front)/band)**2) * Math.exp(-age*.36)*w.power;
        const origin=Math.exp(-dist/(hexR*1.65))*Math.exp(-age*2.6)*.72*w.power;
        energy+=ridge+origin;
        field+=ridge*(j%2?1:-1);
      }
      energy=clamp(energy,0,1.85);
      const hit=smooth(clamp(energy/1.25,0,1));
      const scale=(.79+ambient*.13)+hit*.34;
      const r=hexR*.82*scale;
      let hue;
      if(hit<.16)hue=style.base+c.hueOffset*14;
      else hue=(field>=0?style.a:style.b)+c.hueOffset*12+hit*10;
      const light=27+ambient*11+hit*37;
      const alpha=.33+ambient*.19+hit*.47;
      // Avoid per-hexagon Canvas shadow blur: it is costly on mobile GPUs.
      ctx.shadowBlur=0;
      ctx.lineWidth=1.05+hit*1.85;
      ctx.strokeStyle=`hsla(${hue},${hit>.1?97:66}%,${light}%,${alpha})`;
      hex(c.x,c.y,r);ctx.stroke();
      ctx.shadowBlur=0;
      if(hit>.4){
        ctx.strokeStyle=`hsla(${style.c},90%,81%,${(hit-.4)*.45})`;
        ctx.lineWidth=.75;
        hex(c.x,c.y,r*.47);ctx.stroke();
      }
      if(circlesVisible() && hit>.7){ctx.beginPath();ctx.arc(c.x,c.y,1+hit*1.6,0,TAU);ctx.fillStyle=`hsla(${style.a},98%,80%,${(hit-.55)*.62})`;ctx.fill();}
    }
    // Circular ripples are optional in normal mode; hexagonal waves always remain.
    if(circlesVisible()){
      for(const w of alive){
        const age=(elapsed-w.born)/1000;
        if(age>1.4)continue;
        const rr=age*speed;
        ctx.lineWidth=1.4;
        ctx.strokeStyle=`hsla(${style.a},95%,79%,${Math.max(0,.37-age*.28)})`;
        ctx.beginPath();ctx.arc(w.x,w.y,Math.max(1,rr),0,TAU);ctx.stroke();
      }
    }
  }
  function frame(now){
    raf=0;if(paused||document.hidden)return;
    if(!last)last=now;
    const dt=Math.min(now-last,40),before=elapsed;
    last=now;elapsed+=dt;
    if(!lightMode && !pointerLast.size && elapsed>backgroundResumeAt){
      ambientElapsed+=Math.max(0,elapsed-Math.max(before,backgroundResumeAt));
    }
    // Paint at most ~30 FPS for waves and ~24 FPS when only the ambient breath runs.
    // Keep clock updates at rAF cadence so the last ripple ends on time.
    const minInterval=waves.length?33:42;
    if(!lastPaint || now-lastPaint>=minInterval || (waves.length&&!hasActiveWaves())){
      lastPaint=now;draw();
    }
    scheduleAnimation();
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0;lastPaint=0;}else scheduleAnimation();});
  let resizeTimer=0;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,90);},{passive:true});
  setLightMode(lightMode);setPause(paused);
  // No automatic startup wave: render starts only when the user interacts.
})();
</script>
