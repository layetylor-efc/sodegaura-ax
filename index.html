<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d5faf">
  <title>sodegaura-ax | GitHub Pages</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#e8f4ff,#f8fbff);color:#10233e;padding:24px}
    main{width:min(720px,100%);background:#fff;border:1px solid #d8e4ef;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(16,35,62,.12)}
    .badge{display:inline-block;border-radius:999px;padding:6px 10px;background:#e8f3ff;color:#0d5faf;font-weight:800;font-size:12px}
    h1{font-size:clamp(32px,8vw,58px);line-height:1.05;margin:14px 0 10px}
    p{line-height:1.8;color:#617086}
    .ok{margin-top:20px;padding:14px;border-radius:16px;background:#eefbf7;border:1px solid #bfe8d9;color:#086b57;font-weight:800}
    @media(prefers-color-scheme:dark){body{background:#091423;color:#f5f9ff}main{background:#111f32;border-color:#33475f}p{color:#c4d0dc}.badge{background:#17304e;color:#a9d0ff}.ok{background:#0e2b25;border-color:#245b4e;color:#b7f3df}}
  </style>
</head>
<body>
  <main>
    <span class="badge">GitHub Pages Ready</span>
    <h1>sodegaura-ax</h1>
    <p>このリポジトリはGitHub PagesでHTMLを公開できる状態です。公開したいHTMLを <strong>index.html</strong> に置き換えると、その内容がトップページとして表示されます。</p>
    <div class="ok">✓ 公開基盤の準備完了</div>
  </main>
</body>
</html>
